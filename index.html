<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>VR180 Viewer</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0b0e13; --panel:rgba(5,7,10,.85); --panel2:rgba(18,22,31,.85); --line:#262d3d;
    --text:#e8ecf3; --muted:#9aa6b8; --accent:#e8b33a; --accent-text:#171106;
    --btn:rgba(27,34,48,.92); --btn-on:#2a2110;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#000;color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;height:100dvh;overflow:hidden;position:fixed;inset:0;width:100%}
  button,input{font:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- full-screen stage ---------- */
  .stage{position:fixed;inset:0;width:100vw;height:100dvh;background:#000;z-index:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .divider{position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,.22);pointer-events:none}
  .eye-label{position:absolute;top:8px;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.65);background:rgba(0,0,0,.45);padding:2px 7px;border-radius:20px;pointer-events:none}
  .eye-label.l{left:10px}.eye-label.r{right:10px}
  .hint{position:absolute;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.55);padding:5px 10px;border-radius:20px;pointer-events:none;white-space:nowrap}
  video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}

  /* ---------- overlay toolbar (single row, horizontally scrollable) ---------- */
  .toolbar{position:fixed;top:0;left:0;right:0;z-index:10;padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 6px calc(8px + env(safe-area-inset-left));display:flex;flex-wrap:nowrap;gap:6px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .urlrow{display:flex;gap:6px;flex:0 0 auto;align-items:center}
  .urlrow input{width:min(300px,52vw);min-width:120px;background:rgba(10,13,19,.92);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font-family:var(--mono);font-size:11.5px}
  .urlrow input::placeholder{color:var(--muted);font-family:system-ui,sans-serif;font-size:12px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--btn);color:var(--text);border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:0 0 auto}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .btn[aria-pressed="true"]{background:var(--btn-on);border-color:var(--accent);color:var(--accent)}
  .btn.ghost{background:rgba(27,34,48,.55)}
  .btn:disabled{opacity:.55;cursor:default}

  /* ---------- load status line (always visible, under the toolbar) ---------- */
  .loadstatus{position:fixed;top:calc(54px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));z-index:6;font-family:var(--mono);font-size:11.5px;color:var(--text);background:rgba(0,0,0,.62);padding:4px 9px;border-radius:6px;pointer-events:none;max-width:calc(100vw - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loadstatus.ok{color:#7ee2a0}
  .loadstatus.ng{color:#ff9d9d}
  .loadstatus.busy{color:var(--accent)}
  body.ui-off .loadstatus{display:none}

  /* ---------- status overlaid on the canvas, bottom-left ---------- */
  .statusbar{position:fixed;left:calc(8px + env(safe-area-inset-left));bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;font-family:var(--mono);font-size:10.5px;color:rgba(232,236,243,.8);background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px;display:flex;flex-wrap:nowrap;gap:3px 12px;pointer-events:none;max-width:calc(100vw - 130px);overflow:hidden;white-space:nowrap}
  .statusbar b{color:#fff;font-weight:600}

  /* ---------- small floating button to bring the UI back ---------- */
  .ui-show{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;appearance:none;border:1px solid rgba(255,255,255,.35);background:rgba(10,13,19,.45);color:rgba(255,255,255,.85);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;display:none}
  body.ui-off .toolbar{display:none}
  body.ui-off .logwrap{display:none}
  body.ui-off .statusbar{display:none}
  body.ui-off .ui-show{display:block}
  body.ui-off .hint{display:none}

  /* ---------- overlay diagnostic log panel ---------- */
  .logwrap{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;flex-direction:column;height:38dvh;min-height:140px;max-height:70dvh;padding-bottom:env(safe-area-inset-bottom)}
  .logwrap.open{display:flex}
  .loghead{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line)}
  .loghead span{font-size:12px;font-weight:700;letter-spacing:.04em}
  .loghead .loghead-btns{display:flex;gap:6px}
  .loghead button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px}
  #log{flex:1;overflow-y:auto;padding:8px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.65;word-break:break-all}
  #log .t{color:#6f7d92}
  #log .ok{color:#7ee2a0}
  #log .ng{color:#ff8a8a}
  #log .ev{color:#a9c6ff}

  @media (max-width:560px){
    .hint{display:none}
  }
  @media (orientation:landscape) and (max-height:480px){
    .toolbar{gap:5px;padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
    .btn{padding:5px 9px;font-size:12px}
    .urlrow input{padding:5px 8px}
    .logwrap{height:55dvh}
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="glcanvas"></canvas>
  <div class="divider"></div>
  <span class="eye-label l" id="labelL">L</span>
  <span class="eye-label r" id="labelR">R</span>
  <div class="hint">ドラッグで見回し</div>
  <video id="video" crossorigin="anonymous" playsinline loop preload="auto" muted></video>
</div>

<div class="toolbar">
  <div class="urlrow">
    <input id="urlInput" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Dropboxの動画URL（?u= でも指定可）" aria-label="動画URL">
    <button class="btn" id="loadBtn" type="button">読込</button>
  </div>
  <button class="btn primary" id="playBtn" type="button">▶ 再生</button>
  <button class="btn primary" id="fsBtn" type="button">動画全画面</button>
  <button class="btn" id="gyroBtn" type="button">ジャイロ許可</button>
  <button class="btn" id="distortBtn" type="button" aria-pressed="false">歪み補正 OFF</button>
  <button class="btn" id="swapBtn" type="button" aria-pressed="false">左右入替</button>
  <button class="btn ghost" id="logToggleBtn" type="button" aria-expanded="false" aria-controls="logPanel">ログ表示</button>
  <button class="btn ghost" id="uiHideBtn" type="button">UI隠す</button>
</div>

<div class="loadstatus" id="loadStatus" role="status">動画： 未読み込み（URLを貼って「読込」を押してください）</div>

<div class="statusbar" aria-live="polite">
  <span>yaw <b id="stYaw">0°</b></span>
  <span>pitch <b id="stPitch">0°</b></span>
  <span>歪み補正 <b id="stDist">OFF</b></span>
  <span>左右 <b id="stSwap">通常</b></span>
  <span>texImage2D <b id="stTex">未確認</b></span>
</div>

<button class="ui-show" id="uiShowBtn" type="button" aria-label="UIを表示する">UI表示</button>

<section class="logwrap" id="logPanel" aria-label="診断ログ">
  <div class="loghead">
    <span>診断ログ</span>
    <div class="loghead-btns">
      <button id="clearLog" type="button">クリア</button>
      <button id="logCloseBtn" type="button">閉じる</button>
    </div>
  </div>
  <div id="log" role="log" aria-live="polite"></div>
</section>

<script>
(function(){
  "use strict";
  var logEl = document.getElementById('log');
  var urlInput = document.getElementById('urlInput');
  var video = document.getElementById('video');
  var canvas = document.getElementById('glcanvas');
  var stYaw=document.getElementById('stYaw'), stPitch=document.getElementById('stPitch'),
      stDist=document.getElementById('stDist'), stSwap=document.getElementById('stSwap'), stTex=document.getElementById('stTex');

  function ts(){
    var d=new Date(), p=function(n,l){return String(n).padStart(l||2,'0');};
    return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'.'+p(d.getMilliseconds(),3);
  }
  function log(msg, cls){
    var line=document.createElement('div');
    if(cls) line.className=cls;
    var t=document.createElement('span'); t.className='t'; t.textContent='['+ts()+'] ';
    line.appendChild(t); line.appendChild(document.createTextNode(msg));
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  document.getElementById('clearLog').addEventListener('click', function(){ logEl.innerHTML=''; log('ログをクリアしました'); });

  /* ---------- overlay UI show / hide ---------- */
  document.getElementById('uiHideBtn').addEventListener('click', function(){
    document.body.classList.add('ui-off');
    log('UIを隠しました（右下の「UI表示」で戻ります）');
  });
  document.getElementById('uiShowBtn').addEventListener('click', function(){
    document.body.classList.remove('ui-off');
    log('UIを表示しました');
  });

  /* ---------- log panel toggle (default: closed) ---------- */
  var logPanel=document.getElementById('logPanel');
  var logToggleBtn=document.getElementById('logToggleBtn');
  function setLogOpen(open){
    logPanel.classList.toggle('open', open);
    logToggleBtn.textContent = open?'ログ隠す':'ログ表示';
    logToggleBtn.setAttribute('aria-expanded', String(open));
  }
  logToggleBtn.addEventListener('click', function(){
    var open=!logPanel.classList.contains('open');
    setLogOpen(open);
    log('診断ログパネル: '+(open?'開きました':'閉じました'));
  });
  document.getElementById('logCloseBtn').addEventListener('click', function(){ setLogOpen(false); });

  /* ---------- state ---------- */
  var yaw=0, pitch=0;               // radians
  var distortion=false, swapEyes=false, gyroEnabled=false;
  var texOkLogged=false, texNgLogged=false;

  function updateStatus(){
    stYaw.textContent = Math.round(yaw*180/Math.PI)+'°';
    stPitch.textContent = Math.round(pitch*180/Math.PI)+'°';
    stDist.textContent = distortion?'ON':'OFF';
    stSwap.textContent = swapEyes?'入替中':'通常';
    document.getElementById('labelL').textContent = swapEyes?'R':'L';
    document.getElementById('labelR').textContent = swapEyes?'L':'R';
  }

  /* ---------- visible load status (the log panel is hidden by default,
       so load results must also appear here, on screen) ---------- */
  var loadStatusEl=document.getElementById('loadStatus');
  var loadBtn=document.getElementById('loadBtn');
  function setLoadStatus(text, cls){
    loadStatusEl.textContent=text;
    loadStatusEl.className='loadstatus'+(cls?' '+cls:'');
  }
  function setLoadBusy(busy){
    loadBtn.disabled=busy;
    loadBtn.textContent=busy?'読込中…':'読込';
  }

  /* ---------- video events ---------- */
  var simpleEvents=['loadstart','loadeddata','canplaythrough','pause','waiting','stalled','seeking','ended','emptied','suspend','abort'];
  simpleEvents.forEach(function(name){
    video.addEventListener(name, function(){ log('video event: '+name, 'ev'); });
  });
  video.addEventListener('loadedmetadata', function(){
    log('video event: loadedmetadata  '+video.videoWidth+' x '+video.videoHeight+' / duration '+video.duration+'s', 'ev');
    setLoadStatus('動画： 読み込み中… '+video.videoWidth+'×'+video.videoHeight+' / '+video.duration.toFixed(1)+'秒', 'busy');
  });
  video.addEventListener('canplay', function(){
    log('video event: canplay', 'ev');
    setLoadBusy(false);
    if(wantAutoPlay){
      wantAutoPlay=false;
      tryPlay('自動再生');
    } else if(video.paused){
      setLoadStatus('動画： 準備OK '+video.videoWidth+'×'+video.videoHeight+' — 「▶ 再生」を押してください', 'ok');
    }
  });
  video.addEventListener('playing', function(){
    log('video event: playing', 'ev');
    setLoadStatus('動画： 再生中 '+video.videoWidth+'×'+video.videoHeight, 'ok');
  });
  video.addEventListener('seeked', function(){
    log('video event: seeked  currentTime='+video.currentTime.toFixed(2)+'s', 'ev');
  });
  video.addEventListener('error', function(){
    var e=video.error, code=e?e.code:0;
    log('video event: error  code='+code+' message='+((e&&e.message)||'(なし)'), 'ng');
    setLoadBusy(false);
    clearTimeout(loadWatchdog);
    var msg;
    if(code===2) msg='動画： 読み込み失敗（通信エラー）。電波の良い場所で、もう一度「読込」を押してください';
    else if(code===3) msg='動画： 読み込み失敗（映像をデコードできませんでした）';
    else if(code===4) msg='動画： 読み込み失敗（そのURLでは動画が取得できません。Dropboxの直接リンクか確認してください）';
    else msg='動画： 読み込み失敗（エラーコード '+code+'）';
    setLoadStatus(msg, 'ng');
  });

  var wantAutoPlay=false, loadWatchdog=null;

  function tryPlay(label){
    var p;
    try{ p=video.play(); }catch(err){
      log(label+' 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
      setLoadStatus('動画： 準備OK — 「▶ 再生」を押してください', 'ok');
      return;
    }
    if(p && typeof p.then==='function'){
      p.then(function(){ log(label+' 成功', 'ok'); })
       .catch(function(err){
         log(label+' 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
         if(!video.paused) return;
         setLoadStatus('動画： 準備OK — 「▶ 再生」を押してください', 'ok');
       });
    }
  }

  // Accept messy pastes: pull the first URL out of surrounding text,
  // and rewrite Dropbox share-page links to the direct-download host.
  function normalizeUrl(raw){
    var m=String(raw||'').match(/https?:\/\/[^\s<>"']+/);
    if(!m) return '';
    var u=m[0].replace(/[)\]、。]+$/,'');
    u=u.replace('://www.dropbox.com/','://dl.dropboxusercontent.com/')
       .replace('://dropbox.com/','://dl.dropboxusercontent.com/');
    return u;
  }

  function loadUrl(url){
    var cleaned=normalizeUrl(url);
    if(!cleaned){
      log('読込: URLが空、またはURLとして認識できませんでした', 'ng');
      setLoadStatus('動画： URLが貼られていません。入力欄にURLを貼ってから「読込」を押してください', 'ng');
      urlInput.focus();
      return;
    }
    if(cleaned!==String(url||'').trim()){
      log('読込: 貼り付け内容からURLを抽出/変換しました → '+cleaned);
      urlInput.value=cleaned;
    }
    url=cleaned;
    texOkLogged=false; texNgLogged=false; stTex.textContent='未確認';
    wantAutoPlay=true;
    setLoadBusy(true);
    setLoadStatus('動画： 読み込み中…', 'busy');
    log('読込: '+url);
    clearTimeout(loadWatchdog);
    loadWatchdog=setTimeout(function(){
      if(video.readyState<2){
        setLoadBusy(false);
        setLoadStatus('動画： まだ読み込めていません（20秒経過）。通信が遅いか、URLが違う可能性があります', 'ng');
        log('読込: 20秒経っても readyState='+video.readyState+' です', 'ng');
      }
    }, 20000);
    try{
      video.pause();
      video.src=url;
      video.load();
    }catch(err){
      setLoadBusy(false);
      setLoadStatus('動画： 読み込み失敗（'+(err.message||err)+'）', 'ng');
      log('読込 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
    }
  }
  loadBtn.addEventListener('click', function(){ loadUrl(urlInput.value); });
  urlInput.addEventListener('keydown', function(e){ if(e.key==='Enter') loadUrl(urlInput.value); });

  document.getElementById('playBtn').addEventListener('click', function(){
    log('再生ボタン: video.play() を呼びます');
    if(!video.getAttribute('src') && !video.currentSrc){
      setLoadStatus('動画： まだ読み込んでいません。先にURLを貼って「読込」を押してください', 'ng');
      urlInput.focus();
      return;
    }
    wantAutoPlay=false;
    tryPlay('video.play()');
  });

  /* ---------- native video fullscreen (holder / goggle viewing) ---------- */
  document.getElementById('fsBtn').addEventListener('click', function(){
    log('動画全画面ボタン: ネイティブ全画面再生を起動します');
    // iPhone Safari: play the raw SBS video full-screen in the native player.
    if(typeof video.webkitEnterFullscreen==='function'){
      try{
        video.webkitEnterFullscreen();
        log('video.webkitEnterFullscreen() を呼びました（生のSBS映像がそのまま表示されます）', 'ok');
      }catch(err){
        log('webkitEnterFullscreen 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
      }
      return;
    }
    // Fallback: fullscreen the stage container (canvas view).
    var target=document.getElementById('stage');
    var req=target.requestFullscreen||target.webkitRequestFullscreen;
    if(typeof req==='function'){
      try{
        var r=req.call(target);
        if(r && typeof r.catch==='function'){
          r.catch(function(err){ log('requestFullscreen 失敗: '+(err.name||'')+' '+(err.message||err), 'ng'); });
        }
        log('コンテナの requestFullscreen を呼びました', 'ok');
      }catch(err){
        log('requestFullscreen 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
      }
    } else {
      log('この環境では全画面APIが使えません', 'ng');
    }
  });
  video.addEventListener('webkitbeginfullscreen', function(){ log('video event: webkitbeginfullscreen（ネイティブ全画面 開始）', 'ev'); });
  video.addEventListener('webkitendfullscreen', function(){ log('video event: webkitendfullscreen（ネイティブ全画面 終了）', 'ev'); });
  document.addEventListener('fullscreenchange', function(){
    log('fullscreenchange: '+(document.fullscreenElement?'全画面中':'全画面解除'), 'ev');
  });

  /* ---------- toggles ---------- */
  var distortBtn=document.getElementById('distortBtn');
  distortBtn.addEventListener('click', function(){
    distortion=!distortion;
    distortBtn.textContent='歪み補正 '+(distortion?'ON':'OFF');
    distortBtn.setAttribute('aria-pressed', String(distortion));
    log('歪み補正: '+(distortion?'ON':'OFF'));
    updateStatus();
  });
  var swapBtn=document.getElementById('swapBtn');
  swapBtn.addEventListener('click', function(){
    swapEyes=!swapEyes;
    swapBtn.setAttribute('aria-pressed', String(swapEyes));
    log('左右入替: '+(swapEyes?'ON（L↔R）':'OFF（通常）'));
    updateStatus();
  });

  /* ---------- drag look-around ---------- */
  var dragging=false, lastX=0, lastY=0;
  canvas.addEventListener('pointerdown', function(e){
    dragging=true; lastX=e.clientX; lastY=e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    yaw   -= dx*0.005;
    pitch -= dy*0.005;
    // wrap yaw to -PI..PI, clamp pitch
    while(yaw>Math.PI) yaw-=Math.PI*2;
    while(yaw<-Math.PI) yaw+=Math.PI*2;
    pitch=Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
    updateStatus();
  });
  ['pointerup','pointercancel'].forEach(function(n){
    canvas.addEventListener(n, function(){ dragging=false; });
  });

  /* ---------- gyro ---------- */
  var gyroLogged=false;
  function onOrientation(e){
    if(e.alpha===null && e.beta===null && e.gamma===null) return;
    if(!gyroLogged){ gyroLogged=true; log('deviceorientation 受信開始: alpha='+e.alpha+' beta='+e.beta+' gamma='+e.gamma, 'ok'); }
    var d=Math.PI/180;
    // Approximate mapping for a phone held up / in a holder:
    // alpha (compass heading) -> yaw, beta (front-back tilt, 90 = upright) -> pitch.
    if(e.alpha!==null) yaw = -e.alpha*d;
    if(e.beta!==null) pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, (e.beta-90)*d));
    updateStatus();
  }
  function enableGyro(){
    window.addEventListener('deviceorientation', onOrientation);
    if(!gyroEnabled){ gyroEnabled=true; log('ジャイロ: deviceorientation を有効化しました', 'ok'); }
  }
  document.getElementById('gyroBtn').addEventListener('click', function(){
    log('ジャイロ許可ボタン: 押されました');
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(function(res){
        log('DeviceOrientationEvent.requestPermission() = '+res, res==='granted'?'ok':'ng');
        if(res==='granted') enableGyro();
      }).catch(function(err){
        log('ジャイロ許可 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
      });
    } else {
      log('requestPermission は無い環境です（そのまま有効化します）');
      enableGyro();
    }
  });

  /* ---------- WebGL ---------- */
  var gl = canvas.getContext('webgl', {antialias:false, alpha:false}) || canvas.getContext('experimental-webgl');
  if(!gl){
    log('WebGL NG: コンテキストを取得できませんでした', 'ng');
    return;
  }
  log('WebGL OK', 'ok');

  var vsrc=[
    'attribute vec2 a_pos;',
    'varying vec2 v_pos;',
    'void main(){ v_pos=a_pos; gl_Position=vec4(a_pos,0.0,1.0); }'
  ].join('\n');

  var fsrc=[
    'precision highp float;',
    'varying vec2 v_pos;',
    'uniform sampler2D u_tex;',
    'uniform float u_yaw;',
    'uniform float u_pitch;',
    'uniform float u_eye;',      // 0 = left half, 1 = right half
    'uniform float u_aspect;',   // per-eye viewport aspect (w/h)
    'uniform float u_distort;',  // 0 / 1
    'const float PI = 3.141592653589793;',
    'vec3 rotX(vec3 d, float a){ float c=cos(a), s=sin(a); return vec3(d.x, c*d.y - s*d.z, s*d.y + c*d.z); }',
    'vec3 rotY(vec3 d, float a){ float c=cos(a), s=sin(a); return vec3(c*d.x + s*d.z, d.y, -s*d.x + c*d.z); }',
    'void main(){',
    '  vec2 p = v_pos;',
    '  if(u_distort > 0.5){',
    '    float r2 = dot(p,p);',
    // Cardboard-style barrel compensation (approximate, K1=0.22 K2=0.24)
    '    float f = 1.0 + 0.22*r2 + 0.24*r2*r2;',
    '    p = p * f;',
    '    if(abs(p.x) > 1.35 || abs(p.y) > 1.35){ gl_FragColor = vec4(0.0,0.0,0.0,1.0); return; }',
    '  }',
    // 90 deg vertical FOV -> tan(45deg) = 1.0 ; forward = -Z
    '  vec3 dirCam = normalize(vec3(p.x * u_aspect, p.y, -1.0));',
    '  vec3 dir = rotY(rotX(dirCam, u_pitch), u_yaw);',
    '  if(dir.z > 0.0){ gl_FragColor = vec4(0.0,0.0,0.0,1.0); return; }',
    '  float yawAngle = atan(dir.x, -dir.z);',
    '  float pitchAngle = asin(clamp(dir.y, -1.0, 1.0));',
    '  float u = (u_eye + yawAngle/PI + 0.5) * 0.5;',
    '  float v = 0.5 - pitchAngle/PI;',
    '  gl_FragColor = texture2D(u_tex, vec2(u, v));',
    '}'
  ].join('\n');

  function compile(type, src){
    var s=gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      log('シェーダ コンパイル失敗: '+gl.getShaderInfoLog(s), 'ng');
    }
    return s;
  }
  var prog=gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsrc));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    log('シェーダ リンク失敗: '+gl.getProgramInfoLog(prog), 'ng');
  }
  gl.useProgram(prog);

  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uYaw=gl.getUniformLocation(prog,'u_yaw'),
      uPitch=gl.getUniformLocation(prog,'u_pitch'),
      uEye=gl.getUniformLocation(prog,'u_eye'),
      uAspect=gl.getUniformLocation(prog,'u_aspect'),
      uDistort=gl.getUniformLocation(prog,'u_distort');
  gl.uniform1i(gl.getUniformLocation(prog,'u_tex'), 0);

  var tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  // 1x1 black placeholder until the first video frame arrives
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

  function resize(){
    var stage=document.getElementById('stage');
    var w=stage.clientWidth, h=stage.clientHeight;
    var dpr=Math.min(window.devicePixelRatio||1, 2);
    var cw=Math.max(2, Math.round(w*dpr)), ch=Math.max(2, Math.round(h*dpr));
    if(canvas.width!==cw || canvas.height!==ch){ canvas.width=cw; canvas.height=ch; }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 60); });
  resize();

  function frame(){
    requestAnimationFrame(frame);
    resize();
    var W=canvas.width, H=canvas.height, halfW=Math.floor(W/2);

    if(video.readyState >= 2){
      try{
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        if(!texOkLogged){
          texOkLogged=true; stTex.textContent='成功';
          log('texImage2D 成功 = CORS通過 ('+video.videoWidth+' x '+video.videoHeight+')', 'ok');
        }
      }catch(err){
        if(!texNgLogged){
          texNgLogged=true; stTex.textContent='失敗';
          log('texImage2D 失敗 (CORS): '+(err.name||'Error')+' '+(err.message||err), 'ng');
        }
      }
    }

    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uYaw, yaw);
    gl.uniform1f(uPitch, pitch);
    gl.uniform1f(uDistort, distortion?1:0);
    gl.uniform1f(uAspect, (halfW/Math.max(1,H)));

    // left viewport
    gl.viewport(0, 0, halfW, H);
    gl.uniform1f(uEye, swapEyes?1:0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    // right viewport
    gl.viewport(halfW, 0, W-halfW, H);
    gl.uniform1f(uEye, swapEyes?0:1);
    gl.uniform1f(uAspect, ((W-halfW)/Math.max(1,H)));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(frame);
  updateStatus();

  /* ---------- initial URL from ?u= ---------- */
  var params=new URLSearchParams(location.search);
  var u=params.get('u');
  if(u){
    urlInput.value=u;
    log('?u= パラメータからURLを取得しました');
    loadUrl(u);
  } else {
    log('?u= パラメータなし。URLを貼って「読込」を押してください');
  }
  log('初期化完了: ドラッグで見回し / 再生ボタンで video.play() を実行します');
})();
</script>
</body>
</html>
