<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>VR180 Viewer</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0b0e13; --panel:rgba(5,7,10,.85); --panel2:rgba(18,22,31,.85); --line:#262d3d;
    --text:#e8ecf3; --muted:#9aa6b8; --accent:#e8b33a; --accent-text:#171106;
    --btn:rgba(27,34,48,.92); --btn-on:#2a2110;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#000;color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;height:100dvh;overflow:hidden;position:fixed;inset:0;width:100%}
  button,input{font:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- full-screen stage ---------- */
  .stage{position:fixed;inset:0;width:100vw;height:100dvh;background:#000;z-index:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .divider{position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,.22);pointer-events:none}
  .eye-label{position:absolute;top:8px;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.65);background:rgba(0,0,0,.45);padding:2px 7px;border-radius:20px;pointer-events:none}
  .eye-label.l{left:10px}.eye-label.r{right:10px}
  .hint{position:absolute;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.55);padding:5px 10px;border-radius:20px;pointer-events:none;white-space:nowrap}
  /* ---------- VR fullscreen in-stage overlays ---------- */
  .rotate-hint{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);pointer-events:none;text-align:center}
  .rotate-hint span{font-size:15px;font-weight:700;line-height:1.7;color:#fff;background:rgba(0,0,0,.45);padding:12px 18px;border-radius:10px}
  @media (orientation:portrait){
    body.fs-on .rotate-hint{display:flex}
  }
  .fs-ui{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:4;display:none}
  body.fs-on .fs-ui.show{display:block}
  .fs-ui .btn{background:rgba(10,13,19,.72);border-color:rgba(255,255,255,.4);color:#fff;padding:9px 16px;font-size:13px}
  video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}

  /* ---------- overlay toolbar (single row, horizontally scrollable) ---------- */
  .toolbar{position:fixed;top:0;left:0;right:0;z-index:10;padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 6px calc(8px + env(safe-area-inset-left));display:flex;flex-wrap:nowrap;gap:6px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .urlrow{display:flex;gap:6px;flex:0 0 auto;align-items:center}
  .urlrow input{width:min(300px,52vw);min-width:120px;background:rgba(10,13,19,.92);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font-family:var(--mono);font-size:11.5px}
  .urlrow input::placeholder{color:var(--muted);font-family:system-ui,sans-serif;font-size:12px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--btn);color:var(--text);border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:0 0 auto}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .btn[aria-pressed="true"]{background:var(--btn-on);border-color:var(--accent);color:var(--accent)}
  .btn.ghost{background:rgba(27,34,48,.55)}
  .btn:disabled{opacity:.55;cursor:default}

  /* ---------- load status line (always visible, under the toolbar) ---------- */
  .loadstatus{position:fixed;top:calc(54px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));z-index:6;font-family:var(--mono);font-size:11.5px;color:var(--text);background:rgba(0,0,0,.62);padding:4px 9px;border-radius:6px;pointer-events:none;max-width:calc(100vw - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loadstatus.ok{color:#7ee2a0}
  .loadstatus.ng{color:#ff9d9d}
  .loadstatus.busy{color:var(--accent)}
  body.ui-off .loadstatus{display:none}

  /* ---------- add-to-home-screen hint (browser mode only, dismissible) ---------- */
  .sa-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:8;display:none;align-items:center;gap:8px;background:rgba(10,13,19,.88);border:1px solid var(--line);color:var(--text);font-size:12px;line-height:1.45;padding:7px 8px 7px 13px;border-radius:20px;max-width:calc(100vw - 24px);box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .sa-hint.show{display:flex}
  .sa-hint button{appearance:none;border:1px solid var(--line);background:var(--btn);color:var(--muted);border-radius:50%;width:22px;height:22px;line-height:1;font-size:14px;padding:0;flex:0 0 auto}
  body.ui-off .sa-hint{display:none}
  body.fs-on .sa-hint{display:none}

  /* ---------- status overlaid on the canvas, bottom-left ---------- */
  .statusbar{position:fixed;left:calc(8px + env(safe-area-inset-left));bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;font-family:var(--mono);font-size:10.5px;color:rgba(232,236,243,.8);background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px;display:flex;flex-wrap:nowrap;gap:3px 12px;pointer-events:none;max-width:calc(100vw - 130px);overflow:hidden;white-space:nowrap}
  .statusbar b{color:#fff;font-weight:600}

  /* ---------- small floating button to bring the UI back ---------- */
  .ui-show{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;appearance:none;border:1px solid rgba(255,255,255,.35);background:rgba(10,13,19,.45);color:rgba(255,255,255,.85);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;display:none}
  body.ui-off .toolbar{display:none}
  body.ui-off .logwrap{display:none}
  body.ui-off .statusbar{display:none}
  body.ui-off .ui-show{display:block}
  body.ui-off .hint{display:none}

  /* ---------- overlay diagnostic log panel ---------- */
  .logwrap{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;flex-direction:column;height:38dvh;min-height:140px;max-height:70dvh;padding-bottom:env(safe-area-inset-bottom)}
  .logwrap.open{display:flex}
  .loghead{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line)}
  .loghead span{font-size:12px;font-weight:700;letter-spacing:.04em}
  .loghead .loghead-btns{display:flex;gap:6px}
  .loghead button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px}
  #log{flex:1;overflow-y:auto;padding:8px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.65;word-break:break-all}
  #log .t{color:#6f7d92}
  #log .ok{color:#7ee2a0}
  #log .ng{color:#ff8a8a}
  #log .ev{color:#a9c6ff}

  @media (max-width:560px){
    .hint{display:none}
  }
  @media (orientation:landscape) and (max-height:480px){
    .toolbar{gap:5px;padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
    .btn{padding:5px 9px;font-size:12px}
    .urlrow input{padding:5px 8px}
    .logwrap{height:55dvh}
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="glcanvas"></canvas>
  <div class="divider"></div>
  <span class="eye-label l" id="labelL">L</span>
  <span class="eye-label r" id="labelR">R</span>
  <div class="hint">ドラッグで見回し</div>
  <div class="rotate-hint" id="rotateHint"><span>横画面にしてください<br>スマホを横向きにすると全画面で見られます</span></div>
  <div class="fs-ui" id="fsUi">
    <button class="btn" id="fsExitBtn" type="button">全画面を終了</button>
  </div>
  <video id="video" crossorigin="anonymous" playsinline loop preload="auto" muted></video>
</div>

<div class="toolbar">
  <div class="urlrow">
    <input id="urlInput" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Dropboxの動画URL（?u= でも指定可）" aria-label="動画URL">
    <button class="btn" id="loadBtn" type="button">読込</button>
  </div>
  <button class="btn primary" id="playBtn" type="button">▶ 再生</button>
  <button class="btn primary" id="vrFsBtn" type="button">VR全画面</button>
  <button class="btn primary" id="fsBtn" type="button">動画全画面(生)</button>
  <button class="btn" id="gyroBtn" type="button">ジャイロ許可</button>
  <button class="btn" id="distortBtn" type="button" aria-pressed="false">歪み補正 OFF</button>
  <button class="btn" id="swapBtn" type="button" aria-pressed="false">左右入替</button>
  <button class="btn ghost" id="logToggleBtn" type="button" aria-expanded="false" aria-controls="logPanel">ログ表示</button>
  <button class="btn ghost" id="uiHideBtn" type="button">UI隠す</button>
</div>

<div class="loadstatus" id="loadStatus" role="status">動画： 未読み込み（URLを貼って「読込」を押してください）</div>

<div class="sa-hint" id="saHint" role="note">
  <span>全画面で見るには：共有ボタン →「ホーム画面に追加」</span>
  <button id="saHintClose" type="button" aria-label="案内を閉じる">×</button>
</div>

<div class="statusbar" aria-live="polite">
  <span>yaw <b id="stYaw">0°</b></span>
  <span>pitch <b id="stPitch">0°</b></span>
  <span>歪み補正 <b id="stDist">OFF</b></span>
  <span>左右 <b id="stSwap">通常</b></span>
  <span>texImage2D <b id="stTex">未確認</b></span>
</div>

<button class="ui-show" id="uiShowBtn" type="button" aria-label="UIを表示する">UI表示</button>

<section class="logwrap" id="logPanel" aria-label="診断ログ">
  <div class="loghead">
    <span>診断ログ</span>
    <div class="loghead-btns">
      <button id="clearLog" type="button">クリア</button>
      <button id="logCloseBtn" type="button">閉じる</button>
    </div>
  </div>
  <div id="log" role="log" aria-live="polite"></div>
</section>

<script>
(function(){
  "use strict";
  var logEl = document.getElementById('log');
  var urlInput = document.getElementById('urlInput');
  var video = document.getElementById('video');
  var canvas = document.getElementById('glcanvas');
  var stYaw=document.getElementById('stYaw'), stPitch=document.getElementById('stPitch'),
      stDist=document.getElementById('stDist'), stSwap=document.getElementById('stSwap'), stTex=document.getElementById('stTex');

  function ts(){
    var d=new Date(), p=function(n,l){return String(n).padStart(l||2,'0');};
    return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'.'+p(d.getMilliseconds(),3);
  }
  function log(msg, cls){
    var line=document.createElement('div');
    if(cls) line.className=cls;
    var t=document.createElement('span'); t.className='t'; t.textContent='['+ts()+'] ';
    line.appendChild(t); line.appendChild(document.createTextNode(msg));
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  document.getElementById('clearLog').addEventListener('click', function(){ logEl.innerHTML=''; log('ログをクリアしました'); });

  /* ---------- overlay UI show / hide ---------- */
  document.getElementById('uiHideBtn').addEventListener('click', function(){
    document.body.classList.add('ui-off');
    log('UIを隠しました（右下の「UI表示」で戻ります）');
  });
  document.getElementById('uiShowBtn').addEventListener('click', function(){
    document.body.classList.remove('ui-off');
    log('UIを表示しました');
  });

  /* ---------- log panel toggle (default: closed) ---------- */
  var logPanel=document.getElementById('logPanel');
  var logToggleBtn=document.getElementById('logToggleBtn');
  function setLogOpen(open){
    logPanel.classList.toggle('open', open);
    logToggleBtn.textContent = open?'ログ隠す':'ログ表示';
    logToggleBtn.setAttribute('aria-expanded', String(open));
  }
  logToggleBtn.addEventListener('click', function(){
    var open=!logPanel.classList.contains('open');
    setLogOpen(open);
    log('診断ログパネル: '+(open?'開きました':'閉じました'));
  });
  document.getElementById('logCloseBtn').addEventListener('click', function(){ setLogOpen(false); });

  /* ---------- state ---------- */
  var yaw=0, pitch=0;               // drag look-around offsets (radians)
  var distortion=false, swapEyes=false, gyroEnabled=false, gyroActive=false;
  var devAlpha=0, devBeta=0, devGamma=0;  // latest deviceorientation sample (degrees)
  var texOkLogged=false, texNgLogged=false;

  function updateStatus(){
    var m=buildRotationMatrix();
    // forward = R * (0,0,-1) = -(3rd column) of the column-major matrix
    var fx=-m[6], fy=-m[7], fz=-m[8];
    var dispYaw=Math.atan2(fx, -fz);
    var dispPitch=Math.asin(Math.max(-1, Math.min(1, fy)));
    stYaw.textContent = Math.round(dispYaw*180/Math.PI)+'°';
    stPitch.textContent = Math.round(dispPitch*180/Math.PI)+'°';
    stDist.textContent = distortion?'ON':'OFF';
    stSwap.textContent = swapEyes?'入替中':'通常';
    document.getElementById('labelL').textContent = swapEyes?'R':'L';
    document.getElementById('labelR').textContent = swapEyes?'L':'R';
  }

  /* ---------- visible load status (the log panel is hidden by default,
       so load results must also appear here, on screen) ---------- */
  var loadStatusEl=document.getElementById('loadStatus');
  var loadBtn=document.getElementById('loadBtn');
  function setLoadStatus(text, cls){
    loadStatusEl.textContent=text;
    loadStatusEl.className='loadstatus'+(cls?' '+cls:'');
  }
  function setLoadBusy(busy){
    loadBtn.disabled=busy;
    loadBtn.textContent=busy?'読込中…':'読込';
  }

  /* ---------- video events ---------- */
  var simpleEvents=['loadstart','loadeddata','canplaythrough','pause','waiting','stalled','seeking','ended','emptied','suspend','abort'];
  simpleEvents.forEach(function(name){
    video.addEventListener(name, function(){ log('video event: '+name, 'ev'); });
  });
  video.addEventListener('loadedmetadata', function(){
    log('video event: loadedmetadata  '+video.videoWidth+' x '+video.videoHeight+' / duration '+video.duration+'s', 'ev');
    setLoadStatus('動画： 読み込み中… '+video.videoWidth+'×'+video.videoHeight+' / '+video.duration.toFixed(1)+'秒', 'busy');
  });
  video.addEventListener('canplay', function(){
    log('video event: canplay', 'ev');
    setLoadBusy(false);
    if(wantAutoPlay){
      wantAutoPlay=false;
      tryPlay('自動再生');
    } else if(video.paused){
      setLoadStatus('動画： 準備OK '+video.videoWidth+'×'+video.videoHeight+' — 「▶ 再生」を押してください', 'ok');
    }
  });
  video.addEventListener('playing', function(){
    log('video event: playing', 'ev');
    setLoadStatus('動画： 再生中 '+video.videoWidth+'×'+video.videoHeight, 'ok');
  });
  video.addEventListener('seeked', function(){
    log('video event: seeked  currentTime='+video.currentTime.toFixed(2)+'s', 'ev');
  });
  video.addEventListener('error', function(){
    var e=video.error, code=e?e.code:0;
    log('video event: error  code='+code+' message='+((e&&e.message)||'(なし)'), 'ng');
    setLoadBusy(false);
    clearTimeout(loadWatchdog);
    var msg;
    if(code===2) msg='動画： 読み込み失敗（通信エラー）。電波の良い場所で、もう一度「読込」を押してください';
    else if(code===3) msg='動画： 読み込み失敗（映像をデコードできませんでした）';
    else if(code===4) msg='動画： 読み込み失敗（そのURLでは動画が取得できません。Dropboxの直接リンクか確認してください）';
    else msg='動画： 読み込み失敗（エラーコード '+code+'）';
    setLoadStatus(msg, 'ng');
  });

  var wantAutoPlay=false, loadWatchdog=null;

  function tryPlay(label){
    var p;
    try{ p=video.play(); }catch(err){
      log(label+' 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
      setLoadStatus('動画： 準備OK — 「▶ 再生」を押してください', 'ok');
      return;
    }
    if(p && typeof p.then==='function'){
      p.then(function(){ log(label+' 成功', 'ok'); })
       .catch(function(err){
         log(label+' 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
         if(!video.paused) return;
         setLoadStatus('動画： 準備OK — 「▶ 再生」を押してください', 'ok');
       });
    }
  }

  // Accept messy pastes: pull the first URL out of surrounding text,
  // and rewrite Dropbox share-page links to the direct-download host.
  function normalizeUrl(raw){
    var m=String(raw||'').match(/https?:\/\/[^\s<>"']+/);
    if(!m) return '';
    var u=m[0].replace(/[)\]、。]+$/,'');
    u=u.replace('://www.dropbox.com/','://dl.dropboxusercontent.com/')
       .replace('://dropbox.com/','://dl.dropboxusercontent.com/');
    return u;
  }

  function loadUrl(url){
    var cleaned=normalizeUrl(url);
    if(!cleaned){
      log('読込: URLが空、またはURLとして認識できませんでした', 'ng');
      setLoadStatus('動画： URLが貼られていません。入力欄にURLを貼ってから「読込」を押してください', 'ng');
      urlInput.focus();
      return;
    }
    if(cleaned!==String(url||'').trim()){
      log('読込: 貼り付け内容からURLを抽出/変換しました → '+cleaned);
      urlInput.value=cleaned;
    }
    url=cleaned;
    texOkLogged=false; texNgLogged=false; stTex.textContent='未確認';
    wantAutoPlay=true;
    setLoadBusy(true);
    setLoadStatus('動画： 読み込み中…', 'busy');
    log('読込: '+url);
    clearTimeout(loadWatchdog);
    loadWatchdog=setTimeout(function(){
      if(video.readyState<2){
        setLoadBusy(false);
        setLoadStatus('動画： まだ読み込めていません（20秒経過）。通信が遅いか、URLが違う可能性があります', 'ng');
        log('読込: 20秒経っても readyState='+video.readyState+' です', 'ng');
      }
    }, 20000);
    try{
      video.pause();
      video.src=url;
      video.load();
    }catch(err){
      setLoadBusy(false);
      setLoadStatus('動画： 読み込み失敗（'+(err.message||err)+'）', 'ng');
      log('読込 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
    }
  }
  loadBtn.addEventListener('click', function(){ loadUrl(urlInput.value); });
  urlInput.addEventListener('keydown', function(e){ if(e.key==='Enter') loadUrl(urlInput.value); });

  document.getElementById('playBtn').addEventListener('click', function(){
    log('再生ボタン: video.play() を呼びます');
    if(!video.getAttribute('src') && !video.currentSrc){
      setLoadStatus('動画： まだ読み込んでいません。先にURLを貼って「読込」を押してください', 'ng');
      urlInput.focus();
      return;
    }
    wantAutoPlay=false;
    tryPlay('video.play()');
  });

  /* ---------- native video fullscreen (holder / goggle viewing) ---------- */
  document.getElementById('fsBtn').addEventListener('click', function(){
    log('動画全画面ボタン: ネイティブ全画面再生を起動します');
    // iPhone Safari: play the raw SBS video full-screen in the native player.
    if(typeof video.webkitEnterFullscreen==='function'){
      try{
        video.webkitEnterFullscreen();
        log('video.webkitEnterFullscreen() を呼びました（生のSBS映像がそのまま表示されます）', 'ok');
      }catch(err){
        log('webkitEnterFullscreen 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
      }
      return;
    }
    // Fallback: fullscreen the stage container (canvas view).
    var target=document.getElementById('stage');
    var req=target.requestFullscreen||target.webkitRequestFullscreen;
    if(typeof req==='function'){
      try{
        var r=req.call(target);
        if(r && typeof r.catch==='function'){
          r.catch(function(err){ log('requestFullscreen 失敗: '+(err.name||'')+' '+(err.message||err), 'ng'); });
        }
        log('コンテナの requestFullscreen を呼びました', 'ok');
      }catch(err){
        log('requestFullscreen 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
      }
    } else {
      log('この環境では全画面APIが使えません', 'ng');
    }
  });
  video.addEventListener('webkitbeginfullscreen', function(){ log('video event: webkitbeginfullscreen（ネイティブ全画面 開始）', 'ev'); });
  video.addEventListener('webkitendfullscreen', function(){ log('video event: webkitendfullscreen（ネイティブ全画面 終了）', 'ev'); });

  /* ---------- VR fullscreen (element fullscreen of the WebGL stage) ----------
     iOS 26 Safari supports the standard Fullscreen API for elements.
     Only the stage subtree is rendered while fullscreen, so the toolbar
     and the other overlays disappear on their own; body.fs-on drives the
     portrait rotate notice and the in-stage tap-to-show exit button. */
  var stageEl=document.getElementById('stage');
  var vrFsActive=false, vrFsPending=false, vrFsPrevUiOff=false, vrFsFailTimer=null;
  var fsUi=document.getElementById('fsUi'), fsUiTimer=null;
  function showFsUi(){
    fsUi.classList.add('show');
    clearTimeout(fsUiTimer);
    fsUiTimer=setTimeout(hideFsUi, 3500);
  }
  function hideFsUi(){
    fsUi.classList.remove('show');
    clearTimeout(fsUiTimer);
  }
  function toggleFsUi(){
    if(fsUi.classList.contains('show')) hideFsUi(); else showFsUi();
  }
  function fsElementNow(){
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function vrFsFail(reason){
    vrFsPending=false;
    clearTimeout(vrFsFailTimer);
    log('VR全画面: 失敗（'+reason+'）', 'ng');
    setLoadStatus('VR全画面: 失敗（'+reason+'）', 'ng');
  }
  document.getElementById('vrFsBtn').addEventListener('click', function(){
    log('VR全画面ボタン: ステージ要素への全画面を要求します');
    if(fsElementNow()){
      log('VR全画面: すでに全画面です');
      return;
    }
    var req=stageEl.requestFullscreen || stageEl.webkitRequestFullscreen || stageEl.webkitRequestFullScreen;
    if(typeof req!=='function'){
      vrFsFail('このブラウザでは要素の全画面APIが使えません。「動画全画面(生)」をお試しください');
      return;
    }
    vrFsPending=true;
    clearTimeout(vrFsFailTimer);
    vrFsFailTimer=setTimeout(function(){
      if(vrFsPending && !vrFsActive) vrFsFail('全画面への移行が確認できませんでした');
    }, 1500);
    try{
      var r=req.call(stageEl);
      if(r && typeof r.catch==='function'){
        r.catch(function(err){ vrFsFail((err.name?err.name+': ':'')+(err.message||'不明なエラー')); });
      }
    }catch(err){
      vrFsFail((err.name?err.name+': ':'')+(err.message||err));
    }
  });
  document.getElementById('fsExitBtn').addEventListener('click', function(){
    log('VR全画面: 「全画面を終了」が押されました');
    var ex=document.exitFullscreen || document.webkitExitFullscreen;
    if(typeof ex==='function'){
      try{ ex.call(document); }catch(err){ log('VR全画面: 終了 失敗 '+(err.message||err), 'ng'); }
    }
  });
  function onFsChange(){
    var el=fsElementNow();
    log('fullscreenchange: '+(el?'全画面中':'全画面解除'), 'ev');
    if(el===stageEl){
      vrFsPending=false;
      clearTimeout(vrFsFailTimer);
      if(!vrFsActive){
        vrFsActive=true;
        vrFsPrevUiOff=document.body.classList.contains('ui-off');
        document.body.classList.add('ui-off');
        document.body.classList.add('fs-on');
        showFsUi();
        log('VR全画面: 成功（UIを隠してSBS全画面視聴中。画面タップで終了ボタンを表示）', 'ok');
        setLoadStatus('VR全画面: 成功 — SBS全画面で視聴中です', 'ok');
      }
    } else if(!el && vrFsActive){
      vrFsActive=false;
      document.body.classList.remove('fs-on');
      if(!vrFsPrevUiOff) document.body.classList.remove('ui-off');
      hideFsUi();
      log('VR全画面: 終了（UIを戻しました）', 'ev');
      setLoadStatus('VR全画面: 終了しました', '');
    }
    setTimeout(resize, 60);
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  /* ---------- toggles ---------- */
  var distortBtn=document.getElementById('distortBtn');
  distortBtn.addEventListener('click', function(){
    distortion=!distortion;
    distortBtn.textContent='歪み補正 '+(distortion?'ON':'OFF');
    distortBtn.setAttribute('aria-pressed', String(distortion));
    log('歪み補正: '+(distortion?'ON':'OFF'));
    updateStatus();
  });
  var swapBtn=document.getElementById('swapBtn');
  swapBtn.addEventListener('click', function(){
    swapEyes=!swapEyes;
    swapBtn.setAttribute('aria-pressed', String(swapEyes));
    log('左右入替: '+(swapEyes?'ON（L↔R）':'OFF（通常）'));
    updateStatus();
  });

  /* ---------- drag look-around ---------- */
  var dragging=false, lastX=0, lastY=0, downX=0, downY=0, downT=0;
  canvas.addEventListener('pointerdown', function(e){
    dragging=true; lastX=e.clientX; lastY=e.clientY;
    downX=e.clientX; downY=e.clientY; downT=Date.now();
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    // Inverted mapping (both axes): dragging right now looks toward the
    // opposite side from before, and likewise for up/down.
    yaw   += dx*0.005;
    pitch += dy*0.005;
    // wrap yaw to -PI..PI, clamp pitch
    while(yaw>Math.PI) yaw-=Math.PI*2;
    while(yaw<-Math.PI) yaw+=Math.PI*2;
    pitch=Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
    updateStatus();
  });
  canvas.addEventListener('pointerup', function(e){
    dragging=false;
    // In VR fullscreen, a tap (short, almost no movement) toggles the
    // in-stage controls; drags still only look around.
    if(vrFsActive && downT && (Date.now()-downT)<350){
      var tdx=e.clientX-downX, tdy=e.clientY-downY;
      if(tdx*tdx+tdy*tdy<100) toggleFsUi();
    }
    downT=0;
  });
  canvas.addEventListener('pointercancel', function(){ dragging=false; downT=0; });

  /* ---------- orientation math (quaternions) ----------
     Same conversion as three.js DeviceOrientationControls:
     device Euler(beta, alpha, -gamma, 'YXZ') -> * q1 (-90deg about X, so the
     camera looks out the back of the device) -> * q0 (screen orientation).
     The old alpha/beta->yaw/pitch extraction broke in landscape because the
     device axes no longer line up with the screen axes; the quaternion path
     is correct in portrait and landscape alike. */
  function qAxisAngle(ax, ay, az, angle){
    var s=Math.sin(angle/2);
    return [ax*s, ay*s, az*s, Math.cos(angle/2)];
  }
  function qMul(a, b){
    return [
      a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1],
      a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
      a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3],
      a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2]
    ];
  }
  function qToMat3ColumnMajor(q){
    var x=q[0], y=q[1], z=q[2], w=q[3];
    var x2=x+x, y2=y+y, z2=z+z;
    var xx=x*x2, xy=x*y2, xz=x*z2;
    var yy=y*y2, yz=y*z2, zz=z*z2;
    var wx=w*x2, wy=w*y2, wz=w*z2;
    return new Float32Array([
      1-(yy+zz), xy+wz,     xz-wy,
      xy-wz,     1-(xx+zz), yz+wx,
      xz+wy,     yz-wx,     1-(xx+yy)
    ]);
  }
  function screenAngleDeg(){
    if(window.screen && screen.orientation && typeof screen.orientation.angle==='number') return screen.orientation.angle;
    if(typeof window.orientation==='number') return window.orientation;
    return 0;
  }
  var Q1=[-Math.SQRT1_2, 0, 0, Math.SQRT1_2]; // -90 deg about X (device -> camera)
  function gyroQuaternion(){
    var d=Math.PI/180;
    var q=qMul(qAxisAngle(0,1,0, devAlpha*d), qAxisAngle(1,0,0, devBeta*d)); // Ry(alpha) * Rx(beta)
    q=qMul(q, qAxisAngle(0,0,1, -devGamma*d));                               // * Rz(-gamma)
    q=qMul(q, Q1);                                                           // * q1
    q=qMul(q, qAxisAngle(0,0,1, -screenAngleDeg()*d));                       // * q0 (screen orientation)
    return q;
  }

  /* ---------- horizon lock: rebuild the basis from the forward vector ----------
     The drag rotation is NOT composed as a quaternion chain. Every frame
     it is rebuilt from the view forward vector f:
       right r = normalize(cross(f, world up (0,1,0)))
       up    u = cross(r, f)
     and the matrix columns are (r, u, -f). The right vector is horizontal
     by construction, so the horizon stays exactly level (roll strictly
     zero) at any pitch — verified numerically over yaw -170..170 deg x
     pitch -60..+60 deg (tilt 0.000 deg everywhere, basis orthonormal to
     machine precision). */
  function cross3(a, b){
    return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  }
  function matFromForward(f){
    // cross(f, (0,1,0)) = (-f.z, 0, f.x)
    var r=[-f[2], 0, f[0]];
    var l=Math.sqrt(r[0]*r[0]+r[2]*r[2]);
    if(l<1e-6){
      // Looking straight up or down: the horizontal right axis is
      // undefined; fall back to the drag yaw's right axis so the frame
      // stays stable instead of spinning.
      r=[Math.cos(yaw), 0, -Math.sin(yaw)];
    } else {
      r=[r[0]/l, 0, r[2]/l];
    }
    var u=cross3(r, f);
    return new Float32Array([
      r[0], r[1], r[2],
      u[0], u[1], u[2],
      -f[0], -f[1], -f[2]
    ]);
  }
  function matMul3(A, B){ // column-major 3x3 product A * B
    var C=new Float32Array(9);
    for(var c=0;c<3;c++) for(var r=0;r<3;r++){
      var s=0;
      for(var k=0;k<3;k++) s+=A[k*3+r]*B[c*3+k];
      C[c*3+r]=s;
    }
    return C;
  }
  function buildRotationMatrix(){
    // Drag-only rotation, rebuilt from the drag forward vector:
    // f = Ry(yaw) * Rx(pitch) applied to the straight-ahead (0,0,-1).
    var cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
    var dragMat=matFromForward([-sy*cp, sp, -cy*cp]);
    if(!gyroActive) return dragMat;
    // Gyro ON: the gyro attitude itself is used untouched (with no drag
    // the drag matrix is the identity, so the gyro matrix passes through
    // exactly). The drag offset — itself horizon-locked, i.e. a yaw about
    // the world up axis followed by a pitch about the horizontal right
    // axis — is applied in the world frame on top of it, so dragging
    // never adds tilt of its own on top of the gyro attitude.
    return matMul3(dragMat, qToMat3ColumnMajor(gyroQuaternion()));
  }

  /* ---------- gyro ---------- */
  var gyroLogged=false;
  function onOrientation(e){
    if(e.alpha===null && e.beta===null && e.gamma===null) return;
    if(e.alpha!==null) devAlpha=e.alpha;
    if(e.beta!==null) devBeta=e.beta;
    if(e.gamma!==null) devGamma=e.gamma;
    gyroActive=true;
    if(!gyroLogged){ gyroLogged=true; log('deviceorientation 受信開始: alpha='+e.alpha+' beta='+e.beta+' gamma='+e.gamma+' / 画面向き='+screenAngleDeg()+'°（四元数方式）', 'ok'); }
    updateStatus();
  }
  function enableGyro(){
    window.addEventListener('deviceorientation', onOrientation);
    if(!gyroEnabled){ gyroEnabled=true; log('ジャイロ: deviceorientation を有効化しました', 'ok'); }
  }
  document.getElementById('gyroBtn').addEventListener('click', function(){
    log('ジャイロ許可ボタン: 押されました');
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(function(res){
        log('DeviceOrientationEvent.requestPermission() = '+res, res==='granted'?'ok':'ng');
        if(res==='granted') enableGyro();
      }).catch(function(err){
        log('ジャイロ許可 失敗: '+(err.name||'')+' '+(err.message||err), 'ng');
      });
    } else {
      log('requestPermission は無い環境です（そのまま有効化します）');
      enableGyro();
    }
  });

  /* ---------- WebGL ---------- */
  var gl = canvas.getContext('webgl', {antialias:false, alpha:false}) || canvas.getContext('experimental-webgl');
  if(!gl){
    log('WebGL NG: コンテキストを取得できませんでした', 'ng');
    return;
  }
  log('WebGL OK', 'ok');

  var vsrc=[
    'attribute vec2 a_pos;',
    'varying vec2 v_pos;',
    'void main(){ v_pos=a_pos; gl_Position=vec4(a_pos,0.0,1.0); }'
  ].join('\n');

  var fsrc=[
    'precision highp float;',
    'varying vec2 v_pos;',
    'uniform sampler2D u_tex;',
    'uniform mat3 u_rot;',
    'uniform float u_eye;',      // 0 = left half, 1 = right half
    'uniform float u_aspect;',   // per-eye viewport aspect (w/h)
    'uniform float u_distort;',  // 0 / 1
    'const float PI = 3.141592653589793;',
    'void main(){',
    '  vec2 p = v_pos;',
    '  if(u_distort > 0.5){',
    // Gentle pincushion correction only: the full frame stays visible (no
    // circular cut-out, no shrink). A slight overall magnification of the
    // image (sample scale < 1) keeps the corners filled, and the
    // coefficients are deliberately weak.
    '    float r2 = dot(p,p);',
    '    float f = 0.96 * (1.0 + 0.10*r2 + 0.02*r2*r2);',
    '    p = p * f;',
    '  }',
    // 90 deg vertical FOV -> tan(45deg) = 1.0 ; forward = -Z
    '  vec3 dirCam = normalize(vec3(p.x * u_aspect, p.y, -1.0));',
    '  vec3 dir = u_rot * dirCam;',
    '  if(dir.z > 0.0){ gl_FragColor = vec4(0.0,0.0,0.0,1.0); return; }',
    '  float yawAngle = atan(dir.x, -dir.z);',
    '  float pitchAngle = asin(clamp(dir.y, -1.0, 1.0));',
    '  float u = (u_eye + yawAngle/PI + 0.5) * 0.5;',
    '  float v = 0.5 - pitchAngle/PI;',
    '  gl_FragColor = texture2D(u_tex, vec2(u, v));',
    '}'
  ].join('\n');

  function compile(type, src){
    var s=gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      log('シェーダ コンパイル失敗: '+gl.getShaderInfoLog(s), 'ng');
    }
    return s;
  }
  var prog=gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsrc));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    log('シェーダ リンク失敗: '+gl.getProgramInfoLog(prog), 'ng');
  }
  gl.useProgram(prog);

  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRot=gl.getUniformLocation(prog,'u_rot'),
      uEye=gl.getUniformLocation(prog,'u_eye'),
      uAspect=gl.getUniformLocation(prog,'u_aspect'),
      uDistort=gl.getUniformLocation(prog,'u_distort');
  gl.uniform1i(gl.getUniformLocation(prog,'u_tex'), 0);

  var tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  // 1x1 black placeholder until the first video frame arrives
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

  function resize(){
    var stage=document.getElementById('stage');
    var w=stage.clientWidth, h=stage.clientHeight;
    var dpr=Math.min(window.devicePixelRatio||1, 2);
    var cw=Math.max(2, Math.round(w*dpr)), ch=Math.max(2, Math.round(h*dpr));
    if(canvas.width!==cw || canvas.height!==ch){ canvas.width=cw; canvas.height=ch; }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 60); });
  resize();

  function frame(){
    requestAnimationFrame(frame);
    resize();
    var W=canvas.width, H=canvas.height, halfW=Math.floor(W/2);

    if(video.readyState >= 2){
      try{
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        if(!texOkLogged){
          texOkLogged=true; stTex.textContent='成功';
          log('texImage2D 成功 = CORS通過 ('+video.videoWidth+' x '+video.videoHeight+')', 'ok');
        }
      }catch(err){
        if(!texNgLogged){
          texNgLogged=true; stTex.textContent='失敗';
          log('texImage2D 失敗 (CORS): '+(err.name||'Error')+' '+(err.message||err), 'ng');
        }
      }
    }

    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniformMatrix3fv(uRot, false, buildRotationMatrix());
    gl.uniform1f(uDistort, distortion?1:0);
    gl.uniform1f(uAspect, (halfW/Math.max(1,H)));

    // left viewport
    gl.viewport(0, 0, halfW, H);
    gl.uniform1f(uEye, swapEyes?1:0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    // right viewport
    gl.viewport(halfW, 0, W-halfW, H);
    gl.uniform1f(uEye, swapEyes?0:1);
    gl.uniform1f(uAspect, ((W-halfW)/Math.max(1,H)));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(frame);
  updateStatus();

  /* ---------- standalone (added to Home Screen) detection ----------
     On iPhone the element Fullscreen API is unavailable in Safari, so the
     intended fullscreen route is launching standalone from the Home
     Screen. Show the small how-to hint only while running in a browser
     tab; never when already standalone, and let the user dismiss it. */
  var saHint=document.getElementById('saHint');
  var isStandalone=(window.navigator.standalone===true) ||
    (typeof window.matchMedia==='function' && window.matchMedia('(display-mode: standalone)').matches);
  if(isStandalone){
    log('standalone表示で起動しています（ホーム画面から起動）', 'ok');
  } else {
    saHint.classList.add('show');
    log('ブラウザ表示です。全画面で見るには 共有ボタン →「ホーム画面に追加」から起動してください');
  }
  document.getElementById('saHintClose').addEventListener('click', function(){
    saHint.classList.remove('show');
    log('「ホーム画面に追加」の案内を閉じました');
  });

  /* ---------- initial URL from ?u= ---------- */
  var params=new URLSearchParams(location.search);
  var u=params.get('u');
  if(u){
    urlInput.value=u;
    log('?u= パラメータからURLを取得しました');
    loadUrl(u);
  } else {
    log('?u= パラメータなし。URLを貼って「読込」を押してください');
  }
  log('初期化完了: ドラッグで見回し / 再生ボタンで video.play() を実行します');
})();
</script>
</body>
</html>
